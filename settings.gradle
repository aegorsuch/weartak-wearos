pluginManagement {
    repositories {
        // Runner pool jobs share one egress IP that Maven Central rate-limits (HTTP 429),
        // and Gradle aborts on a 429 instead of trying the next repository.
        def takUser = ['ARTIFACTORY_CONSUME_USER', 'ARTIFACTORY_USER', 'TAK_USERNAME']
                .collect { System.getenv(it) }.find { it != null && !it.isBlank() }
        def takPass = ['ARTIFACTORY_CONSUME_PASSWORD', 'ARTIFACTORY_PASSWORD', 'TAK_PASSWORD']
                .collect { System.getenv(it) }.find { it != null && !it.isBlank() }
        if (takUser && takPass) {
            maven {
                name = 'takArtifactory'
                url = 'https://artifacts.tak.gov/artifactory/maven-release'
                credentials {
                    username = takUser
                    password = takPass
                }
            }
        }
        println "takArtifactory for plugins: ${takUser && takPass ? 'enabled' : 'disabled (no credentials in environment)'}"
        // Ahead of the Plugin Portal, which redirects plugin downloads to Maven Central.
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

def takUser = ['ARTIFACTORY_CONSUME_USER', 'ARTIFACTORY_USER', 'TAK_USERNAME']
        .collect { System.getenv(it) }.find { it != null && !it.isBlank() }
def takPass = ['ARTIFACTORY_CONSUME_PASSWORD', 'ARTIFACTORY_PASSWORD', 'TAK_PASSWORD']
        .collect { System.getenv(it) }.find { it != null && !it.isBlank() }
if (takUser && takPass) {
    gradle.ext.takArtifactoryUrl = 'https://artifacts.tak.gov/artifactory/maven-release'
    gradle.ext.takArtifactoryUser = takUser
    gradle.ext.takArtifactoryPassword = takPass
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (takUser && takPass) {
            maven {
                name = 'takArtifactory'
                url = 'https://artifacts.tak.gov/artifactory/maven-release'
                credentials {
                    username = takUser
                    password = takPass
                }
            }
        }
        google()
        mavenCentral()
        repositories {
            flatDir { dirs 'libs' }
        }
    }
}

rootProject.name = "WearTAK-CIV"
include ':app'
include ':weartak-plugin-host-services-sdk'
