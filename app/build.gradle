import java.time.Instant

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.kotlin.serialization)
    id 'com.google.devtools.ksp'
    //id 'com.android.application'
    //id 'org.jetbrains.kotlin.android'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("signing.properties")

if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream {
        signingProperties.load(it)
    }
}

def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: signingProperties.getProperty(propertyName)
}

android {
    namespace 'com.aitech.weartak_civ'
    compileSdk 35

    androidResources {
        noCompress 'onnx', 'tflite'
    }

    defaultConfig {
        applicationId "com.aitech.weartak_civ"
        minSdk 34
        targetSdk 34
        def baseVersionCode = 584
        def baseVersionName = "5.8.4"

        def buildGitUrl = gitUrl() ?: "unknown"
        def buildGitBranch = gitBranch() ?: "unknown"
        def buildGitCommit = gitCommit() ?: "unknown"

        def buildGitCommitShort = buildGitCommit.length() >= 8 ? buildGitCommit.substring(0, 8) : buildGitCommit

        // CI builds get a unique, increasing versionCode per GitLab pipeline so MDMs such as
        // Knox Manage accept each upload, and a versionName that identifies the pipeline/commit.
        def ciPipelineIid = System.getenv("CI_PIPELINE_IID")?.isInteger() ? System.getenv("CI_PIPELINE_IID").toInteger() : null
        if (ciPipelineIid != null) {
            if (ciPipelineIid >= 10000) {
                throw new GradleException("CI_PIPELINE_IID ${ciPipelineIid} exceeds the versionCode pipeline range (0-9999).")
            }
            versionCode baseVersionCode * 10000 + ciPipelineIid
            versionName "${baseVersionName}-p${ciPipelineIid}+${(System.getenv('CI_COMMIT_SHORT_SHA') ?: buildGitCommitShort)}"
        } else {
            versionCode baseVersionCode
            versionName baseVersionName
        }
        def safeGitBranch = buildGitBranch.replaceAll("[^A-Za-z0-9._-]", "-")

        def buildTimestampUtc = System.getenv("WEARTAK_BUILD_TIMESTAMP_UTC") ?: Instant.now().toString()

        def warningUiDemo = providers.gradleProperty("weartakWarningUiDemo").orElse("false").get()
        if (!(warningUiDemo in ["true", "false"])) {
            throw new GradleException("weartakWarningUiDemo must be true or false")
        }
        def dittoUiDemo = providers.gradleProperty("weartakDittoUiDemo").orElse("false").get()
        if (!(dittoUiDemo in ["true", "false"])) {
            throw new GradleException("weartakDittoUiDemo must be true or false")
        }
        testInstrumentationRunner warningUiDemo == "true" || dittoUiDemo == "true"
                ? "com.aitech.weartak_civ.presentation.WarningUiTestRunner"
                : "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        setProperty("archivesBaseName", "${rootProject.name}-${baseVersionName}-${versionCode}-" + "${safeGitBranch}-${buildGitCommitShort}")

        buildConfigField "String", "GIT_REPOSITORY", "\"${buildGitUrl}\""
        buildConfigField "String", "GIT_BRANCH", "\"${buildGitBranch}\""
        buildConfigField "String", "GIT_COMMIT", "\"${buildGitCommit}\""
        buildConfigField "String", "GIT_COMMIT_SHORT", "\"${buildGitCommitShort}\""
        buildConfigField("String", "BUILD_TIMESTAMP_UTC", "\"${buildTimestampUtc}\"")
        def samsungHrvEnabled = providers.gradleProperty("enableSamsungHrv").orElse("false").get()
        if (!(samsungHrvEnabled in ["true", "false"])) {
            throw new GradleException("enableSamsungHrv must be true or false")
        }
        buildConfigField "boolean", "SAMSUNG_HRV_ENABLED", samsungHrvEnabled
        def batdokAcceptance = providers.gradleProperty("batdokAcceptance").orElse("false").get()
        if (!(batdokAcceptance in ["true", "false"])) {
            throw new GradleException("batdokAcceptance must be true or false")
        }
        def batdokPassphrase = System.getenv("BATTAK_INTEROP_PASSPHRASE") ?: ""
        def batdokSalt = System.getenv("BATTAK_INTEROP_SALT_BASE64") ?: ""
        if (batdokPassphrase.isEmpty() != batdokSalt.isEmpty() ||
                (batdokAcceptance == "true" && batdokPassphrase.isEmpty())) {
            throw new GradleException("BATTAK build requires BATTAK_INTEROP_PASSPHRASE and BATTAK_INTEROP_SALT_BASE64")
        }
        if (!batdokSalt.isEmpty()) {
            try {
                if (java.util.Base64.decoder.decode(batdokSalt).length == 0) {
                    throw new IllegalArgumentException()
                }
            } catch (IllegalArgumentException ignored) {
                throw new GradleException("BATTAK_INTEROP_SALT_BASE64 must encode nonempty salt bytes")
            }
        }
        buildConfigField "String", "BATTAK_INTEROP_PASSPHRASE", groovy.json.JsonOutput.toJson(batdokPassphrase)
        buildConfigField "String", "BATTAK_INTEROP_SALT_BASE64", groovy.json.JsonOutput.toJson(batdokSalt)

//        manifestPlaceholders["repo"] = gitUrl()
//        manifestPlaceholders["branch"] = gitBranch()
//        manifestPlaceholders["commit"] = gitCommit()

        // Inject OpenWeather API key from local.properties into BuildConfig
        def lp = new Properties()
        def lpFile = rootProject.file("local.properties")
        if (lpFile.exists()) lp.load(lpFile.newDataInputStream())
        def owKey = lp.getProperty("OPENWEATHER_API_KEY", "")
        buildConfigField "String", "OPENWEATHER_API_KEY", "\"${owKey}\""
        // CI supplies the authorized Community PDL without exposing it in command arguments.
        def communityPdl = System.getenv("DITTO_COMMUNITY_IDENTITY")?.trim()
        def dittoCommunityIdentity = communityPdl
                ? groovy.json.JsonOutput.toJson(communityPdl)
                : (project.findProperty("dittoCommunityIdentity") ?: "\"\"")

        buildConfigField(
                "String",
                "DITTO_COMMUNITY_IDENTITY",
                dittoCommunityIdentity
        )
    }

    // Grab android key vars, prioritize Gitlab env vars, fall back on local signing.properties

    signingConfigs {
        debug {
            def keystorePath = signingValue(
                    "WEARTAK_DEBUG_KEYSTORE_FILE",
                    "DEBUG_KEYSTORE_FILE"
            )

            if (keystorePath) {
                storeFile rootProject.file(keystorePath)
                storePassword signingValue(
                        "WEARTAK_DEBUG_STORE_PASSWORD",
                        "DEBUG_STORE_PASSWORD"
                )
                keyAlias signingValue(
                        "WEARTAK_DEBUG_KEY_ALIAS",
                        "DEBUG_KEY_ALIAS"
                )
                keyPassword signingValue(
                        "WEARTAK_DEBUG_KEY_PASSWORD",
                        "DEBUG_KEY_PASSWORD"
                )
            }
        }

        release {
            def keystorePath = signingValue(
                    "WEARTAK_RELEASE_KEYSTORE_FILE",
                    "RELEASE_KEYSTORE_FILE"
            )

            if (keystorePath) {
                storeFile rootProject.file(keystorePath)
                storePassword signingValue(
                        "WEARTAK_RELEASE_STORE_PASSWORD",
                        "RELEASE_STORE_PASSWORD"
                )
                keyAlias signingValue(
                        "WEARTAK_RELEASE_KEY_ALIAS",
                        "RELEASE_KEY_ALIAS"
                )
                keyPassword signingValue(
                        "WEARTAK_RELEASE_KEY_PASSWORD",
                        "RELEASE_KEY_PASSWORD"
                )
            }
        }
    }

    def isBuildingBundle = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }
    def emulatorAbi = providers.gradleProperty("weartakEmulatorAbi").orNull
    def debugAbi = providers.gradleProperty("weartakDebugAbi").orNull
    def arm64Qualification = providers.gradleProperty("weartakArm64Qualification").orNull
    def arm64QualificationTasks = [
            [":app:assembleRelease"],
            [":app:clean", ":app:assembleRelease"],
    ]
    def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last().toLowerCase() }
    if (arm64Qualification != null &&
            (arm64Qualification != "true" ||
            !(gradle.startParameter.taskNames in arm64QualificationTasks) ||
            emulatorAbi != null || debugAbi != null)) {
        throw new GradleException(
                "weartakArm64Qualification=true is restricted to :app:assembleRelease, optionally preceded by :app:clean.")
    }
    if (providers.gradleProperty("weartakWarningUiDemo").orElse("false").get() == "true" &&
            (!requestedTasks.any { it.contains("debug") } ||
            requestedTasks.any { it.contains("release") || it in ["build", "assemble", "bundle", "check"] })) {
        throw new GradleException("weartakWarningUiDemo=true is supported only for explicit debug tasks.")
    }
    if (providers.gradleProperty("weartakDittoUiDemo").orElse("false").get() == "true" &&
            (!requestedTasks.any { it.contains("debug") } ||
            requestedTasks.any { it.contains("release") || it in ["build", "assemble", "bundle", "check"] })) {
        throw new GradleException("weartakDittoUiDemo=true is supported only for explicit debug tasks.")
    }
    if (emulatorAbi != null && (emulatorAbi != "x86_64" ||
            !requestedTasks.any { it.contains("debug") } ||
            requestedTasks.any { it.contains("release") || it in ["build", "assemble", "bundle", "check"] })) {
        throw new GradleException("weartakEmulatorAbi=x86_64 is supported only for explicit debug tasks.")
    }
    if (debugAbi != null && (emulatorAbi != null || !(debugAbi in ["x86_64", "arm64-v8a"]) ||
            !requestedTasks.any { it.contains("debug") } ||
            requestedTasks.any { it.contains("release") || it in ["build", "assemble", "bundle", "check"] })) {
        throw new GradleException("weartakDebugAbi requires an explicit debug task and x86_64 or arm64-v8a; do not combine ABI properties.")
    }

    splits {
        abi {
            enable !isBuildingBundle && !gradle.startParameter.taskNames.any { it.toLowerCase().contains("nearbyfixture") }
            reset()
            include(arm64Qualification == "true"
                    ? "arm64-v8a"
                    : (debugAbi ?: emulatorAbi ?: "armeabi-v7a"))
            universalApk false
        }
    }

    buildTypes {
        nearbyFixture {
            initWith debug
            applicationIdSuffix ".nearbyfixture"
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.debug
            buildConfigField "Boolean", "CEP_SIMULATION", "false"
            buildConfigField "Boolean", "CEP_TEST_ALERTS", "false"
            manifestPlaceholders.cepSimulationEnabled = "false"
        }
        debug {
            def dittoUiDemo = providers.gradleProperty("weartakDittoUiDemo").orElse("false").get() == "true"
            applicationIdSuffix dittoUiDemo ? ".ditto.diagnostics.fixture" : ".dev"
            manifestPlaceholders.debugApplication = dittoUiDemo
                    ? "com.aitech.weartak_civ.debug.DittoDiagnosticsFixtureApplication"
                    : "com.aitech.weartak_civ.WearTakApplication"
            manifestPlaceholders.dittoUiDemo = dittoUiDemo.toString()
            buildConfigField "boolean", "DITTO_UI_DEMO", dittoUiDemo.toString()
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            def cepSimulation = project.findProperty("CEP_SIMULATION") ?: "false"
            buildConfigField("Boolean", "CEP_SIMULATION", cepSimulation.toString())
            manifestPlaceholders.cepSimulationEnabled = cepSimulation.toString()
            def cepTestAlerts = project.findProperty("CEP_TEST_ALERTS") ?: "false"
            buildConfigField("Boolean", "CEP_TEST_ALERTS", cepTestAlerts.toString())
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            def cepSimulation = "false"
            buildConfigField("Boolean", "CEP_SIMULATION", cepSimulation.toString())
            manifestPlaceholders.cepSimulationEnabled = cepSimulation
            def cepTestAlerts = "false"
            buildConfigField("Boolean", "CEP_TEST_ALERTS", cepTestAlerts.toString())
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.majorVersion
    }
    buildFeatures {
        compose true
        buildConfig true
        aidl true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packaging {
        resources {
            exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    buildToolsVersion '35.0.0'
    ndkVersion '27.0.12077973'

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { test ->
            if (gradle.ext.has('takArtifactoryUrl')) {
                test.systemProperty 'robolectric.dependency.repo.id', 'takArtifactory'
                test.systemProperty 'robolectric.dependency.repo.url', gradle.ext.takArtifactoryUrl
                test.systemProperty 'robolectric.dependency.repo.username', gradle.ext.takArtifactoryUser
                test.systemProperty 'robolectric.dependency.repo.password', gradle.ext.takArtifactoryPassword
            }
            // Keep the shared Maven cache AND download lock across local worktrees.
            // Sandboxed/CI homes may be read-only; retain the build-local fallback.
            def realHome = new File(System.getProperty('user.home'))
            def mavenDirs = [realHome, new File(realHome, '.m2'),
                             new File(realHome, '.m2/repository')]
            def downloadLock = new File(realHome, '.robolectric-download-lock')
            def sharedHomeUsable = realHome.isDirectory() && mavenDirs.every {
                !it.exists() || (it.isDirectory() && it.canRead() && it.canWrite())
            } && (!downloadLock.exists() || (downloadLock.isFile() && downloadLock.canWrite()))
            def roboHome = sharedHomeUsable ? realHome : file("${buildDir}/test-home")
            test.systemProperty 'user.home', roboHome.absolutePath
            test.environment 'HOME', roboHome.absolutePath
            test.doFirst {
                if (!roboHome.isDirectory() && !roboHome.mkdirs()) {
                    throw new GradleException("Cannot create Robolectric home: ${roboHome}")
                }
            }
        }
    }
}

def pluginSdkPin = new groovy.json.JsonSlurper().parse(rootProject.file('ci/plugin-sdk.json'))
def pluginSdkOs = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
def pluginSdkPlatform = pluginSdkOs.contains('windows') ? 'windows' : pluginSdkOs.contains('linux') ? 'linux' : null
if (pluginSdkPlatform == null) {
    throw new GradleException('Plugin SDK has verified source-build hashes only for Windows and Linux')
}
def pluginSdkExpectedHash = pluginSdkPin.release_sha256[pluginSdkPlatform]
if (!pluginSdkExpectedHash) {
    throw new GradleException("No verified combined plugin SDK artifact hash for ${pluginSdkPlatform}")
}
def pluginSdkIdentity = "${pluginSdkPin.commit.take(12)}-${pluginSdkPin.overlay.source_sha256.take(12)}"
def pluginSdkAarPath = providers.gradleProperty("weartakPluginSdkAar")
        .orElse(rootProject.file(".gradle/sdk/${pluginSdkIdentity}/build/outputs/aar/weartak-plugin-sdk-release.aar").absolutePath)
def sdkNoticeAssets = layout.buildDirectory.dir('generated/pluginSdkNotices')
def sdkNoticeSource = rootProject.file(".gradle/sdk/${pluginSdkIdentity}")
def sdkNotices = tasks.register('generatePluginSdkNotices', Copy) {
    from(sdkNoticeSource) {
        include 'LICENSE', 'LICENSE-ADDITIONAL-PERMISSION.md'
        into 'licenses/weartak-plugin-sdk'
    }
    into sdkNoticeAssets
    doFirst {
        ['LICENSE', 'LICENSE-ADDITIONAL-PERMISSION.md'].each { name ->
            if (!new File(sdkNoticeSource, name).isFile()) {
                throw new GradleException('Missing plugin SDK notices; run python ci/build_plugin_sdk.py')
            }
        }
    }
}
android.sourceSets.main.assets.srcDir(sdkNoticeAssets)
def nativeThirdPartySource = file('src/main/cpp/third_party')
def nativeNoticeAssets = layout.buildDirectory.dir('generated/nativeThirdPartyNotices')
def nativeNoticeFiles = [
        'README.md',
        'asio/LICENSE_1_0.txt',
        'fmt/LICENSE',
        'lwip/COPYING',
        'lz4/LICENSE',
        'lz4/lib/LICENSE',
        'mbedtls/LICENSE',
        'mbedtls/framework/LICENSE',
        'openvpn3/LICENSE.md',
        'openvpn3/LICENSES/AGPL-3.0-only.txt',
        'openvpn3/LICENSES/MPL-2.0.txt',
        'openvpn3/LICENSES/openvpn3-openssl-exception.txt',
        'openvpn3/openvpn/http/LICENSE_1_0.txt'
]
def nativeNotices = tasks.register('generateNativeThirdPartyNotices', Copy) {
    from(nativeThirdPartySource) {
        include(nativeNoticeFiles)
        includeEmptyDirs = false
        eachFile {
            path = "licenses/native/${path}"
        }
    }
    into nativeNoticeAssets
    doFirst {
        nativeNoticeFiles.each { name ->
            if (!new File(nativeThirdPartySource, name).isFile()) {
                throw new GradleException("Missing native dependency notice: ${name}")
            }
        }
    }
}
android.sourceSets.main.assets.srcDir(nativeNoticeAssets)
tasks.register('verifyPluginSdk') {
    inputs.file(pluginSdkAarPath)
    inputs.property('expectedSha256', pluginSdkExpectedHash)
    doLast {
        def aar = file(pluginSdkAarPath.get())
        if (!aar.isFile()) {
            throw new GradleException('Missing pinned plugin SDK; run python ci/build_plugin_sdk.py')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(aar.bytes).encodeHex().toString()
        if (digest != pluginSdkExpectedHash) {
            throw new GradleException("Plugin SDK SHA-256 mismatch: ${digest}")
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyPluginSdk'), sdkNotices, nativeNotices
}

