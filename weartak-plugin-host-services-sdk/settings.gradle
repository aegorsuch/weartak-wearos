pluginManagement {
    repositories {
        // Standalone builds do not inherit the root project's repository configuration.
        def takUser = ['ARTIFACTORY_CONSUME_USER', 'ARTIFACTORY_USER', 'TAK_USERNAME']
                .collect { System.getenv(it) }.find { it != null && !it.isBlank() }
        def takPass = ['ARTIFACTORY_CONSUME_PASSWORD', 'ARTIFACTORY_PASSWORD', 'TAK_PASSWORD']
                .collect { System.getenv(it) }.find { it != null && !it.isBlank() }
        if (takUser && takPass) {
            maven {
                name = 'takArtifactory'
                url = 'https://artifacts.tak.gov/artifactory/maven-release'
                credentials {
                    username = takUser
                    password = takPass
                }
            }
        }
        google()
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'com.android.library' version '8.13.2'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def takUser = ['ARTIFACTORY_CONSUME_USER', 'ARTIFACTORY_USER', 'TAK_USERNAME']
                .collect { System.getenv(it) }.find { it != null && !it.isBlank() }
        def takPass = ['ARTIFACTORY_CONSUME_PASSWORD', 'ARTIFACTORY_PASSWORD', 'TAK_PASSWORD']
                .collect { System.getenv(it) }.find { it != null && !it.isBlank() }
        if (takUser && takPass) {
            maven {
                name = 'takArtifactory'
                url = 'https://artifacts.tak.gov/artifactory/maven-release'
                credentials {
                    username = takUser
                    password = takPass
                }
            }
        }
        google()
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files('../gradle/libs.versions.toml'))
        }
    }
}

rootProject.name = 'weartak-plugin-host-services-sdk'
