release_publisher_tests:
  stage: test
  image:
    name: python:3.12-bookworm
    entrypoint: [""]
  script:
    - python -m unittest discover -s ci/tests -v

host_lint_debug:
  extends: .artifactory_credentials
  stage: test
  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]
  script:
    - chmod +x gradlew
    - sh ci/build_plugin_sdk.sh
    - ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:lintDebug
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - app/build/reports/lint-results-debug.*
      - .gradle/sdk/*/build/outputs/aar/weartak-plugin-sdk-release.aar
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

agp_resolution_diagnostic:
  extends: .artifactory_credentials
  stage: test
  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]
  needs: []
  dependencies: []
  allow_failure: true
  when: manual
  script:
    - sh ci/diagnose_agp_resolution.sh


# ---------------------------------------------------------------------------
# Common WearTAK release build
#
# This is a hidden job and does not run by itself.
# Main, official and manual BATTAK trial builds reuse this configuration.
# ---------------------------------------------------------------------------

.release_build:
  extends: .artifactory_credentials
  stage: build

  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]

  before_script:
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ] && [ "$CI_PIPELINE_SOURCE" = "push" ]; then
        ELIGIBILITY="$(sh ci/release_eligibility.sh)" || exit $?
        if [ "$ELIGIBILITY" = "docs-only" ]; then
          echo "Documentation-only push: no signed release or changelog draft."
          exit 0
        fi
      fi
    - !reference [.artifactory_credentials, before_script]
    - chmod +x gradlew
    - sh ci/build_plugin_sdk.sh

    # Verify required CI variables exist.
    - |
      [ -n "$WEARTAK_RELEASE_KEYSTORE_B64" ] || { echo "ERROR: WEARTAK_RELEASE_KEYSTORE_B64 missing"; exit 1; }
      [ -n "$RELEASE_STORE_PASSWORD" ] || { echo "ERROR: RELEASE_STORE_PASSWORD missing"; exit 1; }
      [ -n "$RELEASE_KEY_ALIAS" ] || { echo "ERROR: RELEASE_KEY_ALIAS missing"; exit 1; }
      [ -n "$RELEASE_KEY_PASSWORD" ] || { echo "ERROR: RELEASE_KEY_PASSWORD missing"; exit 1; }
      [ -n "$DITTO_COMMUNITY_IDENTITY" ] || { echo "ERROR: DITTO_COMMUNITY_IDENTITY missing"; exit 1; }
      [ -n "$BATTAK_INTEROP_PASSPHRASE" ] || { echo "ERROR: BATTAK_INTEROP_PASSPHRASE missing"; exit 1; }
      [ -n "$BATTAK_INTEROP_SALT_BASE64" ] || { echo "ERROR: BATTAK_INTEROP_SALT_BASE64 missing"; exit 1; }

    # Recreate the exact release keystore used locally.
    - printf '%s' "$WEARTAK_RELEASE_KEYSTORE_B64" | base64 -d > "$CI_PROJECT_DIR/app/weartak.keystore"
    - chmod 600 "$CI_PROJECT_DIR/app/weartak.keystore"

    # Recreate signing.properties exactly as the local release build expects.
    - |
      cat > "$CI_PROJECT_DIR/signing.properties" <<EOF
      RELEASE_KEYSTORE_FILE=app/weartak.keystore
      RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
      RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
      RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
      EOF

    # Confirm the keystore/password/alias combination before spending 17 minutes building.
    - |
      keytool -list \
        -keystore "$CI_PROJECT_DIR/app/weartak.keystore" \
        -storepass "$RELEASE_STORE_PASSWORD" \
        -alias "$RELEASE_KEY_ALIAS" >/dev/null

      echo "Release keystore verified."

    - java -version
    - ./gradlew --version


  script:
    # Build the same release APK that we previously built manually.
    # Share the 4Gi Gradle heap with Kotlin and bound workers within the 8Gi container.
    - ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -PbatdokAcceptance=true clean assembleRelease

    # Verify that the resulting APK is signed with the established
    # WearTAK Android production certificate.
    - |
      APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"

      if [ -z "$APK" ]; then
        echo "ERROR: Release APK was not produced."
        exit 1
      fi

      APKSIGNER="/opt/android-sdk-linux/build-tools/35.0.0/apksigner"

      if [ ! -x "$APKSIGNER" ]; then
        echo "ERROR: apksigner not found at $APKSIGNER"
        exit 1
      fi

      EXPECTED_SIGNER="1579b600cd84e619e76a91c2db6b031938c999bc2aad926b9a51ec2b166d348d"

      "$APKSIGNER" verify "$APK" || { echo "ERROR: APK signature verification failed."; exit 1; }

      ACTUAL_SIGNER="$(
        "$APKSIGNER" verify --print-certs "$APK" |
        sed -n 's/.*certificate SHA-256 digest: //p' |
        head -1 |
        tr '[:upper:]' '[:lower:]'
      )"

      echo "Release APK: $APK"
      echo "Expected signer: $EXPECTED_SIGNER"
      echo "Actual signer:   $ACTUAL_SIGNER"

      if [ "$ACTUAL_SIGNER" != "$EXPECTED_SIGNER" ]; then
        echo "ERROR: Unexpected Android signing certificate."
        exit 1
      fi

      echo "Release signing verified."

    # Bind publication to the exact APK whose production signature was checked.
    - sha256sum "$APK" > app/build/outputs/apk/release/verified-apk.sha256
    - sha256sum weartak-plugin-host-services-sdk/build/outputs/aar/weartak-plugin-host-services-sdk-release.aar > weartak-plugin-host-services-sdk/build/outputs/aar/verified-sdk.sha256

batdok_signed_trial:
  extends: .release_build
  environment:
    name: battak-trial
    action: prepare
  artifacts:
    when: on_success
    expire_in: 7 days
    access: developer
    paths:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/release/verified-apk.sha256
      - app/build/outputs/apk/release/output-metadata.json
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "core/weartak-core/wearos-tak-civ" && $CI_COMMIT_BRANCH == "aegorsuch-batdok-patient-sharing" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "core/weartak-core/wearos-tak-civ" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "core/weartak-core/wearos-tak-civ" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Main build
#
# Runs automatically for release-eligible pushes/merges into main.
# Produces a signed release APK for internal testing.
# ---------------------------------------------------------------------------

main_release:
  extends: .release_build
  variables:
    GIT_DEPTH: "0"
  environment:
    name: battak-release
    action: prepare

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/release/verified-apk.sha256
      - app/build/outputs/apk/release/output-metadata.json
      - weartak-plugin-host-services-sdk/build/outputs/aar/weartak-plugin-host-services-sdk-release.aar
      - weartak-plugin-host-services-sdk/build/outputs/aar/verified-sdk.sha256

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'


# ---------------------------------------------------------------------------
# Official release
#
# Runs only when an official version tag is created.
#
# Examples:
#   v5.8.0
#   v5.8.0.2
#
# This is the job/pipeline whose URL should be provided to TPC when that
# APK is intended for official publication.
# ---------------------------------------------------------------------------

official_release:
  extends: .release_build

  artifacts:
    when: always
    expire_in: never
    paths:
      - app/build/outputs/apk/release/*.apk

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$/'

# No needs: wait for all earlier stages to succeed, not only the build job.
publish_personal_github_main:
  stage: publish
  image:
    name: python:3.12-bookworm
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  dependencies:
    - main_release
  # Keep the existing group so in-flight publishers stay serialized during cutover.
  resource_group: wearos-github-development
  interruptible: false
  script:
    - |
      ELIGIBILITY="$(sh ci/release_eligibility.sh)" || exit $?
      if [ "$ELIGIBILITY" = "docs-only" ]; then
        echo "Documentation-only push: no publication or changelog draft."
        exit 0
      fi
    - python ci/publish_github_release.py
  artifacts:
    when: on_success
    expire_in: 30 days
    access: developer
    paths:
      - changelog-receipt.json
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "core/weartak-core/wearos-tak-civ" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'

changelog_draft:
  stage: draft
  image:
    name: python:3.12-bookworm
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  dependencies:
    - main_release
    - publish_personal_github_main
  script:
    - |
      ELIGIBILITY="$(sh ci/release_eligibility.sh)" || exit $?
      if [ "$ELIGIBILITY" = "docs-only" ]; then
        echo "Documentation-only push: no changelog draft."
        exit 0
      fi
    - python ci/publish_github_release.py --changelog-draft
  artifacts:
    when: on_success
    expire_in: 30 days
    access: developer
    expose_as: "Changelog draft - review required"
    paths:
      - changelog-drafts/
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "core/weartak-core/wearos-tak-civ" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
